[project]
name = "uiautoframework"
version = "0.1.0"
description = "基于 Selenium + Pytest + Allure 的 UI 自动化测试框架 🚀"
requires-python = ">=3.8"
dependencies = [
    "selenium>=4.6",
    "pytest>=7.2",
    "pytest-rerunfailures>=10.2",
    "pytest-sugar>=0.9.6",
    "pytest-xdist>=3.0.2",
    "allure-pytest>=2.11.1",
    "allure-python-commons>=2.11.1",
    "loguru>=0.6.0",
    "pyyaml>=6.0",
    "pymysql>=1.0.2",
    "pillow>=9.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
